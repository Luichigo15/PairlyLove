[versions]
#Plugins
agp = "9.0.0"
crashlytics = "3.0.6"
hiltPlugin = "2.59"
kotlin = "2.3.0"
ksp = "2.3.4"

#Libraries
androidJunit = "1.3.0"
espresso = "3.7.0"
junit = "4.13.2"

androidxCore = "1.17.0"
activityCompose = "1.12.3"
adaptiveNavigation = "1.3.0-alpha07"
camerax = "1.5.3"
coil = "2.7.0"
composeBom = "2026.01.01"
constraintLayout = "1.1.1"
dataStore = "1.2.0"
firebase = "34.8.0"
hilt = "2.59"
hiltNavigation = "1.3.0"
lifecycle = "2.10.0"
lottie = "6.7.1"
mediaPipe = "0.10.32"
navigation = "1.0.0"
retrofit = "3.0.0"
room = "2.8.4"
sqlCipher = "4.13.0"

[libraries]
#AndroidBase
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref="constraintLayout"}
lifecycle-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "adaptiveNavigation" }
navigation-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation" }
navigation-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation" }

#Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

#Injection
hilt = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-navigation = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigation" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

#Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
fireia = { group = "com.google.firebase", name = "firebase-ai" }
firestore = { group = "com.google.firebase", name = "firebase-firestore" }
crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
analytics = { group = "com.google.firebase", name = "firebase-analytics" }
messaging = { group = "com.google.firebase", name = "firebase-messaging" }

#Persistence
datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "dataStore" }
room = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlCipher" }

#Network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }

#Other
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-compose = { group = "androidx.camera", name = "camera-compose", version.ref = "camerax" }
coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
lottie = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }
mediaPipe = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediaPipe" }

#Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
android-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidJunit" }
espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

#ComposeTest
compose-test-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-test-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-test-ui = { group = "androidx.compose.ui", name = "ui-test-junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hiltPlugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }